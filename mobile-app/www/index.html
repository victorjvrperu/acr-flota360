<!DOCTYPE html>
<html lang="es" class="h-full bg-[#121417]">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ACR Operadores</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #121417;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    .logo-box {
      background: #1E2228;
      border: 1px solid #374151;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    .spinner {
      border: 4px solid rgba(255,255,255,0.1);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border-left-color: #01A95B;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      color: #01A95B;
    }
    .subtitle {
      font-size: 13px;
      color: #9CA3AF;
    }
  </style>
</head>
<body>
  <div class="logo-box">
    <div style="font-size: 40px;">🚜</div>
    <div class="title">ACR FLOTA 360°</div>
    <div class="subtitle">Conectando con Servidor Central...</div>
    <div class="spinner"></div>
  </div>

  <script>
    const TARGET_URL = "http://100.84.247.4:8001/operador";
    setTimeout(() => {
      window.location.replace(TARGET_URL);
    }, 600);
  </script>
</body>
</html>
